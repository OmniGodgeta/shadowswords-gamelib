# RetroVerse TURN relay (coturn). Tailnet-only; see README.md.
listening-port=3478
fingerprint
lt-cred-mech
realm=retroverse
user=retroverse:CHANGE_ME

# Only serve the tailnet (100.64.0.0/10) — no public relay.
allowed-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=0.0.0.0-100.63.255.255
denied-peer-ip=100.128.0.0-255.255.255.255

no-cli
no-tls
no-dtls
no-multicast-peers
simple-log
log-file=stdout